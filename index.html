        {
          "@type": "WholesaleStore",

          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://gastromir.kz/catalog?query={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
